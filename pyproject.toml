[project]
name = "codegraph-mcp"
version = "0.2.0"
description = "Memory-efficient code graph analysis with SSE and shared instance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.68.0",
    "uvicorn[standard]>=0.15.0",
    "sse-starlette>=2.4.1",
    "httpx>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.1.1",
    "click>=8.0.0",
    "pytz>=2025.2",
]

[project.scripts]
codegraph-sse = "codegraph_sse.cli:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
